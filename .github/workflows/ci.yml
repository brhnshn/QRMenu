name: Continuous Integration

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Projeyi Çek (Checkout)
        uses: actions/checkout@v7

      - name: ⚙️ .NET 8 Kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Bağımlılıkları Geri Yükle (Restore)
        run: dotnet restore "QRMenu.sln"

      - name: 🔨 Projeyi Derle (Build)
        run: dotnet build "QRMenu.sln" --no-restore -c Release

      - name: 🧪 Birim Testleri Çalıştır (Test)
        run: dotnet test "QRMenu.sln" --no-build -c Release --collect:"XPlat Code Coverage"
