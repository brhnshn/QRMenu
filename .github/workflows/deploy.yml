name: Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Projeyi Çek (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ .NET 8 Kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🧪 Testleri Çalıştır
        run: dotnet test "QRMenu.sln" --nologo --verbosity minimal

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Projeyi Çek (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ .NET 8 Kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🔨 Projeyi Derle (Publish) ve ZIP'le
        run: |
          dotnet publish src/QRMenu.Web/QRMenu.Web.csproj -c Release -r linux-x64 --self-contained false -o publish_output
          cd publish_output
          zip -r ../QRMenu.zip ./*

      - name: 🚀 ZIP Dosyasını VDS'e Aktar (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          password: ${{ secrets.VDS_PASSWORD }}
          port: ${{ secrets.VDS_PORT }}
          source: "QRMenu.zip"
          target: "/var/www/QRMenu"

      - name: 🔄 VDS Üzerinde Unzip Et ve Sistemi Yeniden Başlat (SSH)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          password: ${{ secrets.VDS_PASSWORD }}
          port: ${{ secrets.VDS_PORT }}
          script: |
            echo "1. Hedef klasore gidiliyor..."
            cd /var/www/QRMenu

            echo "2. Yeni Zip dosyasi cikartiliyor (uploads korunarak)..."
            unzip -o QRMenu.zip -d /var/www/QRMenu

            echo "3. Cikartilan Zip dosyasi siliniyor..."
            rm -f QRMenu.zip

            echo "4. Servisler Yeniden Baslatiliyor..."
            if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet qrmenu; then
              sudo systemctl restart qrmenu
            else
              SCRIPT_PATH=$(find / -type f -name "project-manager.sh" 2>/dev/null | head -n 1)
              if [ -n "$SCRIPT_PATH" ]; then
                echo "Script bulundu: $SCRIPT_PATH"
                bash -i -c "source ~/.bashrc 2>/dev/null || true; cd /var/www/ && bash '$SCRIPT_PATH' restart"
              else
                bash -i -c "source ~/.bashrc 2>/dev/null || true; cd /var/www/ && project-manager.sh restart"
              fi
            fi

            echo "5. Health check doğrulaması yapılıyor..."
            sleep 3
            curl -k -f https://localhost:8080/health || curl -k -f http://localhost:5000/health || true
            echo "Deploy tamamlandı!"
